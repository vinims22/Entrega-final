name: CI/CD, Testes e Deploy PWA

on:
  push:
    branches:
      - main 
  pull_request:
    branches:
      - main
  workflow_dispatch: 

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '20'
  WEB_FOLDER: web

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        # Apenas especifica a versão, sem tentar configurar cache de dependências.
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # CORRIGIDO: Instala http-server e lighthouse de forma global (-g)
      - name: Instalar dependências globais para teste
        run: npm install -g http-server lighthouse

      - name: Criar diretório de build
        run: mkdir build
        
      - name: Copiar arquivos web para build
        run: cp -r ${{ env.WEB_FOLDER }}/. build/

      - name: Servir a aplicação estática
        run: npx http-server ./build --port 8080 &
        
      - name: Esperar o servidor subir
        run: sleep 5
        
      - name: Rodar Lighthouse e gerar relatório
        run: npx lighthouse http://localhost:8080 --output html --output-path ./lighthouse_report.html --chrome-flags="--no-sandbox --headless=new"
      
      - name: Upload do Artefato (Relatório Lighthouse)
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse_report.html
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artefato de Deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_and_test 
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
